[project]
name = "eltstar-minimal-example"
version = "0.1.0"
description = "The smallest fully-working eltstar pipeline: schema, fake data, one transformation."
readme = "README.md"
authors = [
    { name = "Jochen Gietzen", email = "jochen.gietzen@gmail.com" },
    {name = "Tim Bossenmaier", email="bossenti@posteo.de"}
]
requires-python = ">=3.13"
dependencies = [
    "eltstar",
    "eltstar-engine-polars",
    "polars>=1.34.0",
]

[tool.uv]
package = true

[tool.uv.sources]
eltstar = { workspace = true }
eltstar-engine-polars = { workspace = true }

[build-system]
requires = ["uv_build>=0.8.12,<0.9.0"]
build-backend = "uv_build"
