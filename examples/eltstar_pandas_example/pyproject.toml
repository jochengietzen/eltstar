[project]
name = "eltstar-pandas-example"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Jochen Gietzen", email = "jochen.gietzen@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "eltstar",
    "eltstar-engine-pandas",
    "eltstar-engine-polars",
    "eltstar-rs-dbx-asset-bundle-jobs",
    "pandas>=3.0.1",
    "polars>=1.34.0",
    "pytest>=9.0.2",
    "tabulate>=0.10.0",
]

[tool.uv]
package = true

[tool.uv.sources]
eltstar = { workspace = true }
eltstar-engine-pandas = { workspace = true }
eltstar-engine-polars = { workspace = true }
eltstar-rs-dbx-asset-bundle-jobs = { workspace = true }


[project.scripts]
eltstar-pandas-example = "eltstar_pandas_example:main"

[build-system]
requires = ["uv_build>=0.8.12,<0.9.0"]
build-backend = "uv_build"
