[project]
name = "eltstar-file-logger-example"
version = "0.1.0"
description = "Example eltstar logger plugin that writes log output to a rotating file"
readme = "README.md"
requires-python = ">=3.13"
authors = [
    {name = "Jochen Gietzen", email="jochen.gietzen@gmail.com"},
    {name = "Tim Bossenmaier", email="bossenti@posteo.de"},
]
dependencies = [
    "eltstar",
]

[project.entry-points."eltstar.logger"]
file_handler = "eltstar_file_logger_example.plugin:setup"

[tool.uv]
package = true

[tool.uv.sources]
eltstar = { workspace = true }

[tool.uv.build-backend]
module-name = ["eltstar_file_logger_example"]
module-root = "src"

[build-system]
requires = ["uv_build>=0.8.12,<0.9.0"]
build-backend = "uv_build"
